<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北京·带外国朋友玩手机地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=bjv10">
</head>
<body data-page="overview">
  <main class="shell">
    <aside aria-label="玩法列表">
      <header class="overview-header">
        <h1 data-guide-title>手机旅行地图</h1>
        <p class="sub" data-guide-subtitle>从住地出发；主列表按项目类型组织，先看想做什么，再看推荐去哪个商家或地点。</p>
      </header>

      <section id="placeList" class="list" aria-label="玩法列表"></section>
    </aside>

    <section class="map-wrap" aria-label="行程地图">
      <div id="map"></div>
      <div class="map-tools" aria-label="地图工具">
        <button id="locateButton" class="map-button primary" type="button">定位我</button>
        <button id="fitButton" class="map-button" type="button">看全部</button>
        <div id="locationStatus" class="location-status">点“定位我”显示当前位置。</div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="guide-data.js?v=bjv10"></script>
  <script src="travel-map.js?v=bjv10"></script>
</body>
</html>
