<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beijing Travel Map for Visitors</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=bjv11">
</head>
<body data-page="overview">
  <main class="shell">
    <aside aria-label="Place list">
      <header class="overview-header">
        <h1 data-guide-title>Mobile Travel Map</h1>
        <p class="sub" data-guide-subtitle>Start from home base; pick what you want to do, then see where to go.</p>
      </header>

      <section id="placeList" class="list" aria-label="Place list"></section>
    </aside>

    <section class="map-wrap" aria-label="Trip map">
      <div id="map"></div>
      <div class="map-tools" aria-label="Map tools">
        <button id="locateButton" class="map-button primary" type="button">Locate Me</button>
        <button id="fitButton" class="map-button" type="button">Show All</button>
        <div id="locationStatus" class="location-status">Tap “Locate Me” to show your position.</div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="guide-data.js?v=bjv11"></script>
  <script src="travel-map.js?v=bjv11"></script>
</body>
</html>
