<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baochao Hutong citywalk 宝钞胡同 · Guide</title>
  <link rel="stylesheet" href="styles.css?v=bjv9">
</head>
<body data-page="detail" data-place-id="baochao">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="eyebrow" data-category-title></span>
        <h1 data-place-title>Visit Plan</h1>
      </div>
      <nav class="nav-actions" aria-label="Page navigation">
        <a class="button" href="index.html">Overview Map</a>
        <a class="button primary" data-internal-map-link href="#">Site Map</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <span class="pill" data-step-count>Visit Plan</span>
    <p class="summary" data-place-summary></p>

    <section class="playbook-panel" aria-label="Highlights">
      <div class="panel-title">Highlights</div>
      <div id="playbookGroups" class="playbook-grid"></div>
    </section>

    <section id="compactGuide" class="compact-guide" aria-label="Single-stop tips"></section>

    <div class="panel-title sequence-title">Step by Step</div>
    <section class="table-wrap" aria-label="Visit plan table">
      <table>
        <thead>
          <tr>
            <th class="order-cell">#</th>
            <th>Stop / Action</th>
            <th class="nav-cell">Map</th>
            <th>What & How</th>
          </tr>
        </thead>
        <tbody id="sequenceRows"></tbody>
      </table>
    </section>
  </main>

  <script src="guide-data.js?v=bjv9"></script>
  <script src="travel-map.js?v=bjv9"></script>
</body>
</html>
